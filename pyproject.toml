[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alto"
version = "0.1.0"
description = "Alto: a desktop music theory trainer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    # PySide6 6.12.0 drops a reference to None on every call that returns nothing, which aborts the program after enough
    # painting on Python 3.11 (3.12 and later never free None, so they are not affected).
    "PySide6>=6.8,!=6.12.0 ; python_version < '3.12'",
    "PySide6>=6.8 ; python_version >= '3.12'",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pyright>=1.1.400", "pre-commit>=3.5"]

[project.gui-scripts]
alto = "alto.__main__:main"

[tool.setuptools.package-data]
alto = ["assets/piano/*", "assets/samples/*/*", "assets/ui/*", "assets/fonts/*", "assets/icon*"]

[tool.setuptools.packages.find]
include = ["alto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["alto"]  # measure the app, not the tests

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]  # the line that starts the app is only reached by running it

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["alto", "tests"]

[tool.ruff.format]
skip-magic-trailing-comma = false  # a trailing comma keeps a list, dict or call one element per line (the default, kept on purpose)

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B",
    # Habits the code already has, kept that way: one return style, no commented-out code, no shadowed builtins, and so on.
    "RET", "PERF", "FURB", "ERA", "A", "PLE", "ICN", "RSE", "LOG", "G", "INP", "PGH", "FLY",
    "PIE",  # no needless range(0, n), pass, or duplicated class fields
    "ISC",  # a string split over lines inside a list must be wrapped in brackets, so a missing comma cannot hide in it
    "COM812",  # a list, dict or call split over lines ends with a trailing comma. Not COM819: a trailing comma on a short
    # line is how you keep it one per line.
]
ignore = [
    "B905",  # zip() without strict=: the zipped sequences are built to the same length
    "E741",  # one-letter names such as `l` for a letter name are normal in the music code
]

[tool.ruff.lint.per-file-ignores]
"alto/ui/icons.py" = ["E501"]  # SVG path data
"alto/ui/style.py" = ["E501"]  # the stylesheet template

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["PySide6.QtGui.QColor", "PySide6.QtCore.QModelIndex"]  # defaults that are never mutated

[tool.pyright]
include = ["alto", "tests", "scripts"]
pythonVersion = "3.11"  # the oldest Python Alto supports, so newer-only features are caught
typeCheckingMode = "basic"
