[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alto"
version = "0.1.0"
description = "Alto: a desktop music theory trainer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    # PySide6 6.12.0 drops a reference to None on every call that returns nothing, which aborts the program after enough
    # painting on Python 3.11 (3.12 and later never free None, so they are not affected).
    "PySide6>=6.8,!=6.12.0 ; python_version < '3.12'",
    "PySide6>=6.8 ; python_version >= '3.12'",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pyright>=1.1.400", "pre-commit>=3.5"]

[project.gui-scripts]
alto = "alto.__main__:main"

[tool.setuptools.package-data]
alto = ["assets/piano/*", "assets/samples/*/*", "assets/ui/*", "assets/fonts/*", "assets/icon*"]

[tool.setuptools.packages.find]
include = ["alto*"]

[tool.pytest.ini_options]
testpaths = ["tests", "alto"]
addopts = "--doctest-modules"  # the Examples in docstrings run as tests, so they cannot go out of date
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["alto"]  # measure the app, not the tests

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]  # the line that starts the app is only reached by running it

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["alto", "tests"]

[tool.ruff.format]
skip-magic-trailing-comma = false  # a trailing comma keeps a list, dict or call one element per line (the default, kept on purpose)

[tool.ruff.lint]
preview = true  # the DOC rules are preview rules ...
explicit-preview-rules = true  # ... and this turns on only the preview rules named in `select`, not all of them
# The numpy convention switches these off, so they are added back: a docstring on every __init__, every parameter described, and
# the text of a docstring starting on the line after the opening quotes.
extend-select = ["D107", "D417", "D213"]  # D213: a multi-line docstring starts on the line after the opening quotes
select = [
    "E", "F", "W", "I", "UP", "B",
    # Habits the code already has, kept that way: one return style, no commented-out code, no shadowed builtins, and so on.
    "RET", "PERF", "FURB", "ERA", "A", "PLE", "ICN", "RSE", "LOG", "G", "INP", "PGH", "FLY",
    "PIE",  # no needless range(0, n), pass, or duplicated class fields
    "ISC",  # a string split over lines inside a list must be wrapped in brackets, so a missing comma cannot hide in it
    "PLR0917",  # only the first parameter may be positional; the rest are keyword-only, so calls name their arguments
    # Every module, class, function and method has a NumPy-style docstring that describes each parameter and the return value,
    # and every signature is annotated. Packages not yet documented are excluded below, and each line goes when its package is done.
    "D",
    "ANN",
    "DOC201", "DOC202", "DOC402", "DOC403", "DOC501",  # not DOC502: a Raises section may name errors that a called function raises
    "COM812",  # a list, dict or call split over lines ends with a trailing comma. Not COM819: a trailing comma on a short
    # line is how you keep it one per line.
]
ignore = [
    "B905",  # zip() without strict=: the zipped sequences are built to the same length
    "E741",  # one-letter names such as `l` for a letter name are normal in the music code
]

[tool.ruff.lint.pylint]
max-positional-args = 1

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Not documented yet. Remove a line when that package has its docstrings and annotations.
"alto/ui/icons.py" = ["E501"]  # E501: SVG path data
"alto/ui/style.py" = ["E501"]  # E501: the stylesheet template
"tests/**" = [
    "PLR0917",  # pytest passes fixtures to test functions as plain parameters
    "D200",  # a test's summary and Parameters stay on separate lines, even when there are no parameters
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["PySide6.QtGui.QColor", "PySide6.QtCore.QModelIndex"]  # defaults that are never mutated

[tool.pyright]
include = ["alto", "tests", "scripts"]
pythonVersion = "3.11"  # the oldest Python Alto supports, so newer-only features are caught
typeCheckingMode = "basic"

# Tests reach into widgets and settings that the application keeps optional (a screen's current question, a window's profile ...)
# and check them by asserting on what they find, so these two checks stay on for the application and are off for the tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportOptionalMemberAccess = false
reportOptionalSubscript = false
