<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="118" height="20" viewBox="0 0 118 20" role="img" aria-labelledby="title">
  <title id="title">Anki compatible</title>
  <defs>
    <clipPath id="corners"><rect width="118" height="20" rx="3"/></clipPath>
    <linearGradient id="sheen" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#corners)">
    <rect width="51" height="20" fill="#555"/>
    <rect x="51" width="67" height="20" fill="#0074b8"/>
    <rect width="118" height="20" fill="url(#sheen)"/>
  </g>
  <!-- Anki desktop launcher icon from https://github.com/ankitects/anki/blob/a78c31d2954f4e6d620e74e992ed994b0febe9d4/qt/installer/app/resources/anki.png -->
  <image x="4" y="1" width="18" height="18" xlink:href="data:image/png;base64,"/>
  <g fill="white" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">
    <text x="36" y="14">Anki</text>
    <text x="84.5" y="14">compatible</text>
  </g>
</svg>
