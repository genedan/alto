# Run with `pre-commit install` once; after that the quick checks run on every commit and the tests run on every push.
# Update the pinned versions with `pre-commit autoupdate`.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^alto/assets/
      - id: end-of-file-fixer
        exclude: ^alto/assets/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1500]
        exclude: ^alto/assets/(piano|samples)/  # bundled recordings are large on purpose

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  # The tests run when pushing, not on every commit, so commits stay quick.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: sh scripts/run-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # A reminder, not a gate: say so when the interface has changed since the docs screenshots were made.
  - repo: local
    hooks:
      - id: docs-fresh
        name: docs screenshots are up to date
        entry: sh scripts/check-docs.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
