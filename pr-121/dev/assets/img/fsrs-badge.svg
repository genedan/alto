<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="71" height="20" viewBox="0 0 71 20" role="img" aria-labelledby="title">
  <title id="title">FSRS 6</title>
  <defs>
    <clipPath id="corners"><rect width="71" height="20" rx="3"/></clipPath>
    <linearGradient id="sheen" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-opacity=".1"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#corners)">
