    <rect width="71" height="20" fill="url(#sheen)"/>
  </g>
  <!-- Open Spaced Repetition logo from https://github.com/open-spaced-repetition/py-fsrs/blob/main/osr_logo.png -->
  <image x="5" y="2" width="16" height="16" xlink:href="data:image/png;base64,"/>
  <g fill="white" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">
    <text x="37" y="14">FSRS</text>
    <text x="62.5" y="14">6</text>
