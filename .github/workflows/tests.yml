name: Tests

# Run the test suite on every pull request and on every push to main, on the oldest Python Alto supports and a recent one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt's offscreen platform needs a few system libraries even though nothing is drawn on a screen.
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Install Alto and its test tools
        run: python -m pip install -e ".[dev]"

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
