name: Verify installed dependency notices
on:
  push:
    branches: [trial/qt-audio-release]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build, install, verify licenses and upgrade
        shell: pwsh
        run: scripts/build-windows.ps1
